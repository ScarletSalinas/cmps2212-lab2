<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer Lab</title>

    <style>

        .box {
            width: 200px; 
            height: 200px;
            background-color: lightgray;
            border: 2px solid black;
            margin: 10px;
            padding: 20px;
        }

        .boxes-container {
            display: flex;
            margin-bottom: 20px;
            justify-content: center;
        }

        .buttons-container {
            display: flex;
            gap: 10px;
            justify-content: center; 
        }
    
        button {
            padding: 10px 20px;
        }
       

    </style>
</head>
<body>
    <h1 id="main-heading">Color Changer Lab</h1>
    
    <div class="boxes-container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 3</div>
    </div>
    

    <div class="buttons-container">
        <button id="btn-red">Make Red</button>
        <button id="btn-blue">Make Blue</button>
        <button id="btn-green">Make Green</button>
        <button id="reset-btn">Reset All</button>
    </div>
    
    <script defer>
        // JavaScript will go here
    </script>
</body>
</html>
