<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer Lab</title>

    <style>

        .box {
            width: 200px; 
            height: 200px;
            background-color: lightgray;
            border: 2px solid black;
            margin: 10px;
            padding: 20px;
        }

        .boxes-container {
            display: flex;
            margin-bottom: 20px;
            justify-content: center;
        }

        .buttons-container {
            display: flex;
            gap: 10px;
            justify-content: center; 
        }
    
        button {
            padding: 10px 20px;
        }
       
    </style>
</head>
<body>
    <h1 id="main-heading">Color Changer Lab</h1>
    
    <div class="boxes-container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 3</div>
    </div>
    

    <div class="buttons-container">
        <button id="btn-red">Make Red</button>
        <button id="btn-blue">Make Blue</button>
        <button id="btn-green">Make Green</button>
        <button id="reset-btn">Reset All</button>
    </div>
    
    <script defer>
        // Selecting all 3 boxes
        const boxes = document.querySelectorAll(".box");
        const redBtn = document.getElementById("btn-red");
        const blueBtn = document.getElementById("btn-blue");
        const greenBtn = document.getElementById("btn-green");
        const resetBtn = document.getElementById("reset-btn");

        // Check if any boxes were found
        if(boxes.length === 0) {
            console.error("No elements with class 'box' found");
        }

        if(!redBtn) {
            console.error("Make Red button not found");
        }

         if(!blueBtn) {
            console.error("Make Blue button not found");
        }

         if(!greenBtn) {
            console.error("Make Red button not found");
        }

         if(!resetBtn) {
            console.error("Reset button not found");
        }

        // Function to change all boxes color
        function changeBoxColor(color) {
            boxes.forEach(box => {
                box.style.backgroundColor = color;
            });
        }

        // Add event listeners for each button only if they exist
        if(redBtn && boxes.length > 0) {
            redBtn.addEventListener("click", () => {
                changeBoxColor("#70161E");
            });
        }

        if(blueBtn && boxes.length > 0) {
            blueBtn.addEventListener("click", () => {
                changeBoxColor("#1C3144");
            });
        }

        if(greenBtn && boxes.length > 0) {
            greenBtn.addEventListener("click", () => {
                changeBoxColor("#149911");
            });
        }

        if(resetBtn && boxes.length > 0) {
            resetBtn.addEventListener("click", () => {
                changeBoxColor("lightgray");
            });
        }
    </script>
</body>
</html>
